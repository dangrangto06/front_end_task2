<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Management System</title>
  <meta name="description" content="Sign in to your Management System account." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple: #6c5ce7;
      --purple-dark: #5649c0;
      --purple-light: #a29bfe;
      --bg: #eef0fb;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --input-focus: #6c5ce7;
      --error: #ef4444;
      --transition: 0.25s ease;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(145deg, #eaecf8 0%, #f0eeff 50%, #e8edf8 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* TOP LOGO */
    .brand-logo {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, #7c6ff7, #5c4ee8);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.35rem; font-weight: 800; color: #fff;
      margin-bottom: 18px;
      box-shadow: 0 8px 24px rgba(108,92,231,0.35);
      letter-spacing: -0.5px;
    }

    .brand-title {
      font-size: 1.6rem; font-weight: 800; color: var(--text);
      margin-bottom: 6px; text-align: center;
    }

    .brand-subtitle {
      font-size: 0.88rem; color: var(--muted);
      text-align: center; margin-bottom: 28px;
    }

    /* CARD */
    .card {
      background: var(--card);
      border-radius: 18px;
      padding: 36px 40px 32px;
      width: 100%; max-width: 440px;
      box-shadow: 0 8px 40px rgba(100,90,200,0.1), 0 1px 3px rgba(0,0,0,0.06);
    }

    .card-title {
      font-size: 1.15rem; font-weight: 700; color: var(--text);
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 0.82rem; color: var(--muted);
      margin-bottom: 26px; line-height: 1.5;
    }

    /* FORM */
    .form-group { margin-bottom: 18px; }

    .form-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 6px;
    }

    label {
      font-size: 0.82rem; font-weight: 600; color: var(--text);
      display: block;
    }

    .forgot-link {
      font-size: 0.8rem; font-weight: 500; color: var(--purple);
      text-decoration: none;
      transition: color var(--transition);
    }
    .forgot-link:hover { color: var(--purple-dark); text-decoration: underline; }

    .input-wrap { position: relative; }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 9px; font-size: 0.88rem;
      font-family: inherit; color: var(--text);
      background: #fafafa;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    }

    input[type="email"]:focus,
    input[type="password"]:focus,
    input[type="text"]:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(108,92,231,0.12);
      background: #fff;
    }

    input::placeholder { color: #b0b8c8; }

    .toggle-pw {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      font-size: 0.78rem; font-weight: 600; color: var(--purple);
      padding: 2px 4px; border-radius: 4px;
      transition: color var(--transition);
    }
    .toggle-pw:hover { color: var(--purple-dark); }

    /* REMEMBER ME */
    .remember-row {
      display: flex; align-items: center; gap: 9px;
      margin-bottom: 22px; margin-top: 4px;
    }

    .remember-row input[type="checkbox"] {
      width: 16px; height: 16px; accent-color: var(--purple); cursor: pointer;
    }

    .remember-row label {
      font-size: 0.82rem; color: var(--muted); font-weight: 400; cursor: pointer;
    }

    /* SUBMIT BTN */
    .btn-submit {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #7c6ff7, #5c4ee8);
      color: #fff; border: none; border-radius: 9px;
      font-size: 0.95rem; font-weight: 700;
      font-family: inherit; cursor: pointer;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 18px rgba(108,92,231,0.35);
      transition: background var(--transition), box-shadow var(--transition), transform var(--transition);
      margin-bottom: 20px;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #6c5ce7, #4c3fd0);
      box-shadow: 0 6px 24px rgba(108,92,231,0.5);
      transform: translateY(-1px);
    }

    .btn-submit:active { transform: translateY(0); }

    /* DIVIDER */
    .card-footer-text {
      text-align: center; font-size: 0.82rem; color: var(--muted);
    }

    .card-footer-text a {
      color: var(--purple); font-weight: 600; text-decoration: none;
      transition: color var(--transition);
    }
    .card-footer-text a:hover { color: var(--purple-dark); text-decoration: underline; }

    /* PAGE FOOTER */
    .page-footer {
      margin-top: 28px; font-size: 0.76rem; color: #a0aec0; text-align: center;
    }

    /* SHAKE ANIMATION */
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-6px); }
      40%,80% { transform: translateX(6px); }
    }
    .shake { animation: shake 0.4s ease; }

    /* TOAST */
    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: #1e293b; color: #fff; padding: 12px 24px; border-radius: 10px;
      font-size: 0.85rem; font-weight: 500; white-space: nowrap;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
      z-index: 9999;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div class="brand-logo" id="brand-logo" aria-hidden="true">M</div>
  <h1 class="brand-title">Welcome Back!</h1>
  <p class="brand-subtitle">Sign in to continue to your account.</p>

  <div class="card" role="main">
    <h2 class="card-title">Login to your account</h2>
    <p class="card-desc">Enter your email and password to get started.</p>

    <form id="login-form" novalidate>
      <!-- Email -->
      <div class="form-group">
        <label for="login-email">Email Address</label>
        <div class="input-wrap" style="margin-top:6px">
          <input
            type="email"
            id="login-email"
            name="email"
            placeholder="name@example.com"
            autocomplete="email"
            required
          />
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <div class="form-row">
          <label for="login-password">Password</label>
          <a href="#" class="forgot-link" id="forgot-link">Forgot password?</a>
        </div>
        <div class="input-wrap">
          <input
            type="password"
            id="login-password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
          <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Show password">Show</button>
        </div>
      </div>

      <!-- Remember me -->
      <div class="remember-row">
        <input type="checkbox" id="remember-me" name="remember" />
        <label for="remember-me">Remember me</label>
      </div>

      <button type="submit" class="btn-submit" id="btn-signin">Sign In</button>
    </form>

    <p class="card-footer-text">
      Don't have an account?
      <a href="register.html" id="link-register">Create an account</a>
    </p>
  </div>

  <p class="page-footer">© 2026 My Website. All rights reserved.</p>

  <div class="toast" id="toast" role="alert" aria-live="polite"></div>

  <script>
    // Toggle password visibility
    const pwInput = document.getElementById('login-password');
    const toggleBtn = document.getElementById('toggle-pw');
    toggleBtn.addEventListener('click', () => {
      const isHidden = pwInput.type === 'password';
      pwInput.type = isHidden ? 'text' : 'password';
      toggleBtn.textContent = isHidden ? 'Hide' : 'Show';
    });

    // Show toast notification
    function showToast(msg, duration = 3000) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), duration);
    }

    // Hardcoded accounts
    const ACCOUNTS = [
      { email: 'hana@gmail.com', password: '123456789' }
    ];

    // Form submit
    document.getElementById('login-form').addEventListener('submit', e => {
      e.preventDefault();
      const email    = document.getElementById('login-email').value.trim().toLowerCase();
      const password = document.getElementById('login-password').value;
      const emailEl  = document.getElementById('login-email');
      const passEl   = document.getElementById('login-password');

      if (!email) {
        emailEl.classList.add('shake');
        setTimeout(() => emailEl.classList.remove('shake'), 400);
        showToast('⚠️ Please enter your email.');
        return;
      }
      if (!password) {
        passEl.classList.add('shake');
        setTimeout(() => passEl.classList.remove('shake'), 400);
        showToast('⚠️ Please enter your password.');
        return;
      }

      const btn = document.getElementById('btn-signin');
      btn.textContent = 'Signing in…';
      btn.disabled = true;

      setTimeout(() => {
        const matched = ACCOUNTS.find(acc => acc.email === email && acc.password === password);

        if (matched) {
          showToast('✅ Login successful! Redirecting…', 2000);
          setTimeout(() => { window.location.href = 'home.html'; }, 1800);
        } else {
          // Wrong credentials
          emailEl.classList.add('shake');
          passEl.classList.add('shake');
          emailEl.style.borderColor = '#ef4444';
          passEl.style.borderColor  = '#ef4444';
          setTimeout(() => {
            emailEl.classList.remove('shake');
            passEl.classList.remove('shake');
            emailEl.style.borderColor = '';
            passEl.style.borderColor  = '';
          }, 600);
          showToast('❌ Email hoặc mật khẩu không đúng.', 3000);
          btn.textContent = 'Sign In';
          btn.disabled = false;
        }
      }, 1000);
    });

    // Forgot password
    document.getElementById('forgot-link').addEventListener('click', e => {
      e.preventDefault();
      showToast('📧 Password reset link sent to your email.');
    });
  </script>
</body>
</html>
